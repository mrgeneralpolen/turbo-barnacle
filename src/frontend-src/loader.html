<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#08080d">
<title>Расписание — Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html,body{margin:0;padding:0;background:#08080d;color:#9aa0b4;font:600 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100%}
  #boot{display:flex;align-items:center;justify-content:center;height:100%;text-align:center;padding:0 24px}
</style>
</head>
<body>
<div id="boot">Загрузка расписания…</div>
<script>
(function(){
  /* Загрузчик: само приложение (app.html) сервер отдаёт ТОЛЬКО
     с валидной Telegram initData. Вне Telegram сюда нельзя:
     ни по прямой ссылке, ни из браузера. */
  var t=window.Telegram && Telegram.WebApp;
  var id=(t && t.initData)||"";
  var boot=document.getElementById("boot");
  function fail(msg){ boot.textContent=msg; }
  if(!id){ fail("Откройте приложение через Telegram."); return; }
  fetch("app.html?initData="+encodeURIComponent(id),{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error("forbidden"); return r.text(); })
    .then(function(html){ document.open(); document.write(html); document.close(); })
    .catch(function(){ fail("Не удалось открыть приложение. Откройте его через Telegram."); });
})();
</script>
</body>
</html>
